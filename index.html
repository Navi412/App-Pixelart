<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de píxel art</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1e1e1e;
    }

    #canvas {
      border: 1px solid #444;
    }

    #palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      max-width: 512px;
    }

    #toolbar {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div id="toolbar"></div>
  <canvas id="canvas"></canvas>
  <div id="palette"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
